# PR과 sub_main push마다 타입 검사·린트·빌드를 돌린다 (CODING_RULES 3장 머지 조건)
name: CI

on:
  pull_request:
    branches: [sub_main, Leafn_main]
  push:
    branches: [sub_main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
